# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Set default timeout to 3s (3000ms) 
command_timeout = 333000

# Inserts a blank line between shell prompts
add_newline = true

# Configure the prompt format to show username and full directory path
format = """
[](fg:#212736)$username[ ](fg:#212736) $directory $git_branch $git_status $package $python
$character"""

# Username configuration
[username]
show_always = true
style_user = "bg:#212736 fg:blue bold"
style_root = "bg:#212736 fg:red bold"
format = "[$user]($style)"

# Hostname configuration
[hostname]
ssh_symbol = " "
ssh_only = true
format = "[@$hostname]($style) "
style = "green bold"

# Directory configuration
[directory]
style = "bold #1e90ff"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 0  # Show full path
truncate_to_repo = false
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch configuration
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #c266ff"

# Git status configuration
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold #8a2be2" 
ahead = "⇡${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
behind = "⇣${count}"
untracked = "?${count}"
stashed = "↪${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Character configuration
[character]
success_symbol = "[»](bold #66ff66)"
error_symbol = "[✘](bold red)"


