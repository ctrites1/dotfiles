# Starship Config - Aesthetic & Minimal
# Colors defined in [palettes.catppuccin] below.

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true

# Palette: Catppuccin-inspired pastels
palette = "catppuccin"

[palettes.catppuccin]
lavender = "#b4befe"
mauve    = "#cba6f7"
peach    = "#fab387"
teal     = "#94e2d5"
pink     = "#f5c2e7"
yellow   = "#f9e2af"
green    = "#a6e3a1"
red      = "#f38ba8"
blue     = "#89b4fa"
sky      = "#89dceb"
steel    = "#5b8ec6"
overlay  = "#6c7086"

# Two-line format for breathing room
format = """
[╭─](bold overlay)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$python\
$package
[╰─](bold overlay)$character"""

# Minimal username with subtle styling
[username]
show_always = true
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_symbol = "󰣀 "
ssh_only = true
format = "[@$hostname]($style) "
style = "bold teal"

# Directory with no truncation - always shows full path
[directory]
style = "bold steel"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch with icon
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold mauve"

# Clean git status with color coding
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "pink"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
conflicted = "=${count}"

# Node.js with version
[nodejs]
symbol = "󰎙 "
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
style = "bold green"

# Bun runtime
[bun]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

# Python with virtual env highlighting
[python]
symbol = " "
format = '[${symbol}${version}]($style)([ $virtualenv]($style bold)) '
style = "yellow"
detect_extensions = ["py"]
detect_files = [
    "requirements.txt",
    "pyproject.toml",
    ".python-version",
    "Pipfile",
    "poetry.lock",
    "setup.py"
]

# Package version
[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "peach"
display_private = false

# Command duration for long-running tasks
[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "overlay italic"
show_milliseconds = false

# Elegant prompt character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Battery for laptop (optional - uncomment if wanted)
# [battery]
# full_symbol = "󰁹 "
# charging_symbol = "󰂄 "
# discharging_symbol = "󰂃 "
# format = "[$symbol$percentage]($style) "
# 
# [[battery.display]]
# threshold = 20
# style = "bold red"
# 
# [[battery.display]]
# threshold = 50
# style = "peach"

# Time display (optional - uncomment if wanted)
# [time]
# disabled = false
# format = '[\[ $time \]]($style) '
# time_format = "%R"
# style = "overlay"

# Language/Tool icons - Set to disabled, uncomment 'disabled = false' to enable
[aws]
symbol = "  "
format = '[$symbol($profile )($region )]($style)'
style = "bold peach"
disabled = true

