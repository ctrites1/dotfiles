# colors
set-option -sa terminal-overrides ",xterm*:Tc"

# set prefix to Ctrl Space
unbind C-b
# set -g prefix C-Space
# bind C-Space send-prefix
set -g prefix `
bind ` send-prefix

set -g default-command "${SHELL} -l"

# 1 based indexing
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# change status bar position
set-option -g status-position top

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g status-style 'bg=default'

# theme: Catppuccin (git submodule at plugins/catppuccin/tmux, not TPM -- TPM
# would clone it into a generically named plugins/tmux folder).
# Options must be set BEFORE the `run` line; the status bar AFTER it.
# Flavour follows the `theme` command (~/.local/state/theme); mocha by default.
if-shell '[ "$(cat ~/.local/state/theme 2>/dev/null)" = light ]' \
  "set -g @catppuccin_flavor 'latte'" \
  "set -g @catppuccin_flavor 'mocha'"
set -g @catppuccin_status_background 'none' # transparent bar
set -g @catppuccin_window_status_style 'none'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -g status-left-length 100
set -g status-left '#{E:@catppuccin_status_session} '
# @focus_note is set by the `work` / `stop` focus scripts
set -g status-right '#[fg=#{@thm_teal}]#{@focus_note} '

set-option -g status-style bg=default

# nerdfront window panes
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @tmux-nerd-font-window-name-show-name true

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# open panes in current directory
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

# tmux sessionizer
bind-key -r f run-shell "tmux neww $HOME/.config/tmux/tmux_sessionizer"

# nvim zen mode
set-option -g allow-passthrough on

# initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# bracket window names (keep at bottom)
set -g window-status-format " #[fg=#{@thm_mauve},bg=default]#I #W"
set -g window-status-current-format " #[fg=#{@thm_peach},bg=default]#I #W"

bind c new-window -c "#{pane_current_path}"
