# Starship Config - Aesthetic & Minimal
# Color Palette: Catppuccin-inspired pastels with good contrast
# Primary: Lavender (#b4befe), Mauve (#cba6f7), Peach (#fab387)
# Accent: Teal (#94e2d5), Pink (#f5c2e7), Yellow (#f9e2af)

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true

# Two-line format for breathing room
format = """
[╭─](bold #6c7086)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$package
[╰─](bold #6c7086)$character"""

# Minimal username with subtle styling
[username]
show_always = true
style_user = "bold #b4befe"
style_root = "bold #f38ba8"
format = "[$user]($style) "

[hostname]
ssh_symbol = "󰣀 "
ssh_only = true
format = "[@$hostname]($style) "
style = "bold #94e2d5"

# Directory with smart truncation and darker blue
[directory]
style = "bold #5b8ec6"
read_only = " 󰌾"
read_only_style = "#f38ba8"
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch with icon
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold #cba6f7"

# Clean git status with color coding
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "#f5c2e7"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = '$${count}'
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
conflicted = "=${count}"

# Node.js with version
[nodejs]
symbol = "󰎙 "
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
style = "bold #a6e3a1"

# Python with virtual env highlighting
[python]
symbol = " "
format = '[${symbol}${version}]($style)[ \($virtualenv\)]($style bold) '
style = "#f9e2af"
detect_extensions = ["py"]
detect_files = [
    "requirements.txt",
    "pyproject.toml",
    ".python-version",
    "Pipfile",
    "poetry.lock",
    "setup.py"
]

# Package version
[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "#fab387"
display_private = false

# Command duration for long-running tasks
[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "#6c7086 italic"
show_milliseconds = false

# Elegant prompt character
[character]
success_symbol = "[❯](bold #a6e3a1)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #a6e3a1)"

# Battery for laptop (optional - uncomment if wanted)
# [battery]
# full_symbol = "󰁹 "
# charging_symbol = "󰂄 "
# discharging_symbol = "󰂃 "
# format = "[$symbol$percentage]($style) "
# 
# [[battery.display]]
# threshold = 20
# style = "bold #f38ba8"
# 
# [[battery.display]]
# threshold = 50
# style = "#fab387"

# Time display (optional - uncomment if wanted)
# [time]
# disabled = false
# format = '[\[ $time \]]($style) '
# time_format = "%R"
# style = "#6c7086"

