# Starship Config - Aesthetic & Minimal
# Colors defined in [palettes.catppuccin_*] below.

"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
add_newline = true

# Palette: catppuccin_mocha (dark) or catppuccin_latte (light).
# The `theme` command (~/.local/bin/theme) rewrites this line -- keep it on one line.
palette = "catppuccin_latte"

# Two-line format for breathing room
# NOTE: must be declared before [palettes.catppuccin_*] or TOML parses it
# as a key inside that table instead of the top-level prompt format.
format = """
[╭─](bold overlay)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$rust\
$python\
$package
[╰─](bold overlay)$character"""

[palettes.catppuccin_mocha]
lavender = "#b4befe"
mauve    = "#cba6f7"
peach    = "#fab387"
teal     = "#94e2d5"
pink     = "#f5c2e7"
yellow   = "#f9e2af"
green    = "#a6e3a1"
red      = "#f38ba8"
blue     = "#89b4fa"
sky      = "#89dceb"
sapphire = "#74c7ec"
overlay  = "#6c7086"

[palettes.catppuccin_latte]
lavender = "#7287fd"
mauve    = "#8839ef"
peach    = "#fe640b"
teal     = "#179299"
pink     = "#ea76cb"
yellow   = "#df8e1d"
green    = "#40a02b"
red      = "#d20f39"
blue     = "#1e66f5"
sky      = "#04a5e5"
sapphire = "#209fb5"
overlay  = "#9ca0b0"

# Minimal username with subtle styling
[username]
show_always = true
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style) "

[hostname]
ssh_symbol = "󰣀 "
ssh_only = true
format = "[@$hostname]($style) "
style = "bold teal"

# Directory with no truncation - always shows full path
[directory]
style = "bold sapphire"
read_only = " 󰌾"
read_only_style = "red"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"
format = "[$path]($style)[$read_only]($read_only_style) "

# Git branch with icon
[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold mauve"

# Clean git status with color coding
[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "pink"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "📦${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"
conflicted = "=${count}"

# Node.js with version
[nodejs]
symbol = "󰎙 "
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx"]
detect_files = ["package.json", ".node-version", ".nvmrc"]
style = "bold green"

# Bun runtime
[bun]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

# Rust
[rust]
symbol = "󱘗 "
format = "[$symbol($version )]($style) "
style = "bold peach"

# Python with virtual env highlighting
[python]
symbol = " "
format = '[${symbol}${version}]($style)([ $virtualenv]($style bold)) '
style = "yellow"
detect_extensions = ["py"]
detect_files = [
    "requirements.txt",
    "pyproject.toml",
    ".python-version",
    "Pipfile",
    "poetry.lock",
    "setup.py"
]

# Package version
[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "peach"
display_private = false

# Command duration for long-running tasks
[cmd_duration]
min_time = 2000
format = "[took $duration]($style) "
style = "overlay italic"
show_milliseconds = false

# Elegant prompt character
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# Battery for laptop (optional - uncomment if wanted)
# [battery]
# full_symbol = "󰁹 "
